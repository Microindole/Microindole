<svg width="760" height="260" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --panel: #ffffff;
      --fg: #24292f;
      --muted: #0969da;
      --accent: #66ccff;
      --border: rgba(102, 204, 255, 0.85);
    }

    text {
      font-family: "JetBrains Mono", "Consolas", monospace;
      font-size: 18px;
      fill: var(--accent);
    }

    .fg { fill: var(--fg); }
    .muted { fill: var(--muted); }
  </style>

  <rect width="760" height="260" rx="18" fill="var(--panel)"/>
  <rect x="1" y="1" width="758" height="258" rx="18" fill="none" stroke="var(--border)"/>

  <defs>
    <!-- Frame 1 -->
    <clipPath id="f1l1">
      <rect x="40" y="38" width="0" height="28">
        <animate attributeName="width"
          values="0;330;330;0;0"
          keyTimes="0;0.06;0.29;0.31;1"
          dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="f1l2">
      <rect x="40" y="70" width="0" height="28">
        <animate attributeName="width"
          values="0;0;260;260;0;0"
          keyTimes="0;0.06;0.11;0.29;0.31;1"
          dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="f1l3">
      <rect x="40" y="118" width="0" height="28">
        <animate attributeName="width"
          values="0;0;100;100;0;0"
          keyTimes="0;0.11;0.16;0.29;0.31;1"
          dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

