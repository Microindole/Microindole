          dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="f1l5">
      <rect x="40" y="154" width="0" height="28">
        <animate attributeName="width"
          values="0;0;70;70;0;0"
          keyTimes="0;0.20;0.24;0.29;0.31;1"
          dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="f1l6">
      <rect x="160" y="154" width="0" height="28">
        <animate attributeName="width"
          values="0;0;140;140;0;0"
          keyTimes="0;0.24;0.29;0.29;0.31;1"
          dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

