  <text x="40" y="58" clip-path="url(#f1l1)">Signal received from Luo Tianyi.</text>
  <text x="40" y="90" clip-path="url(#f1l2)">Boot sequence completed.</text>
  <text x="40" y="138" class="muted" clip-path="url(#f1l3)">Operator:</text>
  <text x="160" y="138" class="fg" clip-path="url(#f1l4)">Indolyn</text>
  <text x="40" y="174" class="muted" clip-path="url(#f1l5)">Alias:</text>
  <text x="160" y="174" class="fg" clip-path="url(#f1l6)">Microindole</text>

  <text x="40" y="98" class="muted" clip-path="url(#f2l1)">Current status:</text>
  <text x="40" y="150" class="fg" font-size="22" clip-path="url(#f2l2)">coding while listening to Luo Tianyi.</text>

  <text x="40" y="72" class="muted" clip-path="url(#f3l1)">Repository archive of</text>
  <text x="40" y="122" class="fg" font-size="22" clip-path="url(#f3l2)">unfinished ideas,</text>
  <text x="40" y="158" class="fg" font-size="22" clip-path="url(#f3l3)">curiosity,</text>
  <text x="40" y="194" class="fg" font-size="22" clip-path="url(#f3l4)">and successful accidents.</text>

  <text x="40" y="224" fill="var(--accent)">
    _
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>
